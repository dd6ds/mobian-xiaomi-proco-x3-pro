name: Build Mobian image (POCO X3 Pro / vayu)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "User interface"
        type: choice
        options: [phosh, plasma-mobile, lomiri]
        default: phosh
      username:
        description: "Default user"
        type: string
        default: mobian
      password:
        description: "Default password / PIN (visible in the run log!)"
        type: string
        default: "1234"
      kernel_tag:
        description: "sm8150 kernel tag (empty = pinned default from versions.env)"
        type: string
        default: ""
      recipes_ref:
        description: "mobian-recipes commit/branch (empty = pinned default)"
        type: string
        default: ""
      release:
        description: "Publish a GitHub release with the image"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      MOBIAN_ENV: ${{ inputs.environment }}
      MOBIAN_USER: ${{ inputs.username }}
      MOBIAN_PASSWORD: ${{ inputs.password }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker image prune --all --force >/dev/null
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "::warning::No KVM - the image build will be very slow"

      - name: Optional overrides
        run: |
          [ -n "${{ inputs.kernel_tag }}" ]  && echo "KERNEL_TAG=${{ inputs.kernel_tag }}" >> "$GITHUB_ENV"
          [ -n "${{ inputs.recipes_ref }}" ] && echo "MOBIAN_RECIPES_REF=${{ inputs.recipes_ref }}" >> "$GITHUB_ENV"
          true

      - name: SSH key (from secret SSH_AUTHORIZED_KEYS, optional)
        env:
          KEYS: ${{ secrets.SSH_AUTHORIZED_KEYS }}
        run: |
          if [ -n "$KEYS" ]; then
            printf '%s\n' "$KEYS" > "$RUNNER_TEMP/authorized_keys"
            echo "SSH_PUBKEY=$RUNNER_TEMP/authorized_keys" >> "$GITHUB_ENV"
            echo "SSH enabled with key login"
          fi

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: work/dl
          key: dl-${{ hashFiles('versions.env') }}-${{ inputs.kernel_tag }}

      - name: Build kernel + device packages
        run: ./build.sh -K

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ inputs.environment }}-${{ github.run_number }}
          path: out/packages/*.deb
          retention-days: 14

      - name: Build image
        run: ./build.sh -I

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: mobian-vayu-${{ inputs.environment }}-${{ github.run_number }}
          path: |
            out/images/*.tar.xz
            out/images/*.boot-*.img
            out/images/*.sha256sums
            out/images/flash.sh
          compression-level: 0
          retention-days: 7

      - name: Publish release
        if: ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="vayu-${MOBIAN_ENV}-$(date +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          KREL=$(ls out/packages/linux-image-*.deb | sed 's|.*/linux-image-||; s|_.*||')
          cat > notes.md <<EOF
          Mobian (${MOBIAN_ENV}) for the Xiaomi POCO X3 Pro (vayu)

          - Kernel: ${KREL}
          - mobian-recipes: ${MOBIAN_RECIPES_REF:-pinned default}
          - Login: ${MOBIAN_USER} / (password set at build time)

          Download everything into one folder and run \`./flash.sh\` with the phone in fastboot mode.
          See README.md for details. **Flashing erases all data on the phone.**
          EOF
          gh release create "$TAG" --title "Mobian vayu ${MOBIAN_ENV} $(date +%Y-%m-%d) (#${GITHUB_RUN_NUMBER})" \
            --notes-file notes.md \
            out/images/*.tar.xz out/images/*.boot-*.img out/images/*.sha256sums out/images/flash.sh
